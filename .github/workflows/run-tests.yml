name: Nerja AI — N8N Test Suite

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      NERJA_EMAIL: ${{ secrets.NERJA_EMAIL }}
      NERJA_PASSWORD: ${{ secrets.NERJA_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ollama and pull AI model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done'
          ollama pull qwen2.5:0.5b
          echo "Ollama ready"

      - name: Install Node dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Browser Bug Hunt
        id: browser_tests
        run: node browser-tests.js 2>&1 | tee browser-test.log
        continue-on-error: true
        env:
          NERJA_EMAIL: ${{ secrets.NERJA_EMAIL }}
          NERJA_PASSWORD: ${{ secrets.NERJA_PASSWORD }}

      - name: Run Nerja Test Suite
        id: tests
        run: node test-runner.js 2>&1 | tee results-all.log
        continue-on-error: true

      - name: Suite Summary
        if: always()
        run: |
          echo ""
          echo "=== NERJA AI FULL SUITE SUMMARY ==="
          cat results-all.log 2>/dev/null || echo "(no results)"
          echo ""
          if grep -qE "STATUS:.*TEST.*FAILED|STATUS: FAIL$" results-all.log 2>/dev/null; then
            echo "CI STATUS: TESTS FAILED"
            exit 1
          elif grep -qE "STATUS:.*ALL.*TESTS PASSED" results-all.log 2>/dev/null; then
            echo "CI STATUS: ALL TESTS PASSED"
          else
            echo "CI STATUS: UNKNOWN (runner may have errored)"
            exit 1
          fi

      - name: AI Analysis - Ollama Qwen 2.5 0.5B
        if: always()
        continue-on-error: true
        run: |
          RESULTS=$(grep -E "^\[(PASS|FAIL)\]" results-all.log 2>/dev/null | head -30 | tr '\n' ' ')
          if [ -z "$RESULTS" ]; then
            RESULTS=$(grep -E "(✅|❌)" results-all.log 2>/dev/null | head -30 | tr '\n' ' ')
          fi
          if [ -z "$RESULTS" ]; then
            echo "No test results available." > ai-analysis.txt
          else
            PROMPT="QA engineer: analyze Nerja AI test results. Give: 1) overall status 2) any failures with likely root cause 3) top fix recommendation. Under 120 words. Results: $RESULTS"
            echo "$PROMPT" | ollama run qwen2.5:0.5b 2>/dev/null > ai-analysis.txt || echo "(Ollama unavailable)" > ai-analysis.txt
          fi
          echo "=== AI ANALYSIS ==="
          cat ai-analysis.txt

      - name: Generate HTML Report
        if: always()
        run: |
          node generate-report.js
          echo "Report generated"

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'ci: update test results (run #${{ github.run_number }})'

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerja-test-results-${{ github.run_number }}
          path: |
            results-all.log
            results.json
            ai-analysis.txt
            browser-bugs.json
            browser-test.log
          retention-days: 30
