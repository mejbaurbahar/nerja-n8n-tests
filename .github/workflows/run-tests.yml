name: Nerja AI — N8N Test Suite

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NERJA_EMAIL: ${{ secrets.NERJA_EMAIL }}
      NERJA_PASSWORD: ${{ secrets.NERJA_PASSWORD }}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_USER_MANAGEMENT_DISABLED: 'true'
      N8N_ENCRYPTION_KEY: 'nerja-ci-key-2026'
      DB_TYPE: sqlite
      N8N_LOG_LEVEL: info
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_PROCESS: main
      N8N_RUNNERS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential python3 python3-dev libssl-dev

      - name: Install Ollama and pull AI model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done'
          ollama pull qwen2.5:0.5b
          echo "Ollama ready with qwen2.5:0.5b"

      - name: Install n8n
        run: npm install -g n8n@latest --unsafe-perm

      - name: 01 - Authentication Tests
        id: auth
        run: n8n execute --file n8n/01-auth-tests.json 2>&1 | tee results-01.log
        continue-on-error: true

      - name: 02 - Public Pages Availability
        id: pages
        run: n8n execute --file n8n/02-public-pages.json 2>&1 | tee results-02.log
        continue-on-error: true

      - name: 03 - Authenticated App Pages
        id: app
        run: n8n execute --file n8n/03-app-pages-authenticated.json 2>&1 | tee results-03.log
        continue-on-error: true

      - name: 04 - Functional Feature Tests
        id: func
        run: n8n execute --file n8n/04-functional-tests.json 2>&1 | tee results-04.log
        continue-on-error: true

      - name: Suite Summary
        if: always()
        run: |
          echo ""
          echo "=== NERJA AI FULL SUITE SUMMARY ==="
          for f in results-01.log results-02.log results-03.log results-04.log; do
            echo "--- $f ---"
            grep -E "(PASS|FAIL|passed|failed)" "$f" 2>/dev/null || echo "(no result lines)"
          done
          TOTAL_FAIL=$(grep -c "FAIL" results-*.log 2>/dev/null | awk -F: '{sum+=$2} END{print sum+0}')
          echo ""
          if [ "$TOTAL_FAIL" -gt 0 ]; then
            echo "STATUS: FAILED - $TOTAL_FAIL test(s) FAILED"
          else
            echo "STATUS: ALL TESTS PASSED"
          fi

      - name: AI Analysis - Ollama Qwen 2.5 0.5B
        if: always()
        continue-on-error: true
        run: |
          RESULTS=$(grep -hE "(PASS|FAIL|passed|failed)" results-*.log 2>/dev/null | head -30 | tr '\n' ' ')
          if [ -z "$RESULTS" ]; then
            echo "No test results to analyze."
            exit 0
          fi
          echo "=== AI ANALYSIS (Qwen 2.5 0.5B via Ollama) ==="
          PROMPT="QA engineer: analyze Nerja AI automated test results. Give: 1) overall status 2) failures with root cause 3) top priority fix. Under 120 words. Results: $RESULTS"
          echo "$PROMPT" | ollama run qwen2.5:0.5b 2>/dev/null || echo "(Ollama analysis unavailable)"

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerja-test-results-${{ github.run_number }}
          path: results-*.log
          retention-days: 30
