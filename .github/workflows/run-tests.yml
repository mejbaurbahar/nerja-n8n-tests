name: Nerja AI — N8N Test Suite

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NERJA_EMAIL: ${{ secrets.NERJA_EMAIL }}
      NERJA_PASSWORD: ${{ secrets.NERJA_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ollama and pull AI model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done'
          ollama pull qwen2.5:0.5b
          echo "Ollama ready"

      - name: Run Nerja Test Suite
        id: tests
        run: node test-runner.js 2>&1 | tee results-all.log
        continue-on-error: true

      - name: Suite Summary
        if: always()
        run: |
          echo ""
          echo "=== NERJA AI FULL SUITE SUMMARY ==="
          cat results-all.log 2>/dev/null || echo "(no results)"
          echo ""
          if grep -q "STATUS: FAILED" results-all.log 2>/dev/null; then
            echo "CI STATUS: TESTS FAILED"
            exit 1
          elif grep -q "STATUS: ALL TESTS PASSED" results-all.log 2>/dev/null; then
            echo "CI STATUS: ALL TESTS PASSED"
          else
            echo "CI STATUS: UNKNOWN (runner may have errored)"
            exit 1
          fi

      - name: AI Analysis - Ollama Qwen 2.5 0.5B
        if: always()
        continue-on-error: true
        run: |
          RESULTS=$(grep -E "^\[(PASS|FAIL)\]" results-all.log 2>/dev/null | head -30 | tr '\n' ' ')
          if [ -z "$RESULTS" ]; then
            echo "No test results to analyze."
            exit 0
          fi
          echo "=== AI ANALYSIS (Qwen 2.5 0.5B via Ollama) ==="
          PROMPT="QA engineer: analyze Nerja AI test results. Give: 1) overall status 2) failures with root cause 3) top fix. Under 120 words. Results: $RESULTS"
          echo "$PROMPT" | ollama run qwen2.5:0.5b 2>/dev/null || echo "(Ollama unavailable)"

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerja-test-results-${{ github.run_number }}
          path: results-all.log
          retention-days: 30
